
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptCraft - AI Prompt Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:#f5f5f5;padding:25px}
main{max-width:650px;margin:40px auto}
h1{font-size:36px;color:#8b9cff}
p{color:#bdc5d5;line-height:1.6}
.card{background:#1c293b;padding:25px;border-radius:16px;margin-top:25px}
label{display:block;margin:18px 0 8px}
select,textarea,input{width:100%;padding:13px;border-radius:9px;border:1px solid #46536a;background:#101827;color:white;font-size:16px}
textarea{min-height:110px;resize:vertical}
button{background:#7187ff;color:white;border:0;padding:13px 20px;border-radius:9px;font-size:16px;margin-top:18px;cursor:pointer}
button:hover{background:#5268df}
#output{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;padding:15px;border-radius:9px;min-height:90px;margin-top:15px}
footer{text-align:center;color:#8993a5;margin-top:35px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>✨ PromptCraft</h1>
<p>Create clear, useful AI prompts for your ideas, studies and projects.</p>

<div class="card">
<h2>Build your prompt</h2>

<label for="category">Choose a category</label>
<select id="category">
<option>Learning and Education</option>
<option>Programming and Coding</option>
<option>Creative Writing</option>
<option>Business and Ideas</option>
<option>Research and Analysis</option>
</select>

<label for="goal">What do you want to achieve?</label>
<textarea id="goal" placeholder="Describe your task or idea..."></textarea>

<label for="style">Preferred response style</label>
<select id="style">
<option>Simple and beginner-friendly</option>
<option>Detailed and professional</option>
<option>Creative and engaging</option>
<option>Step-by-step explanation</option>
</select>

<button onclick="generatePrompt()">Generate Prompt</button>

<h3>Your generated prompt</h3>
<div id="output">Your prompt will appear here...</div>
  <h3>📚 Prompt History</h3>
<div id="history">No prompts yet.</div>
<button onclick="copyPrompt()">Copy Prompt</button>
</div>

<footer>PromptCraft | Built to make AI easier for everyone.</footer>
</main>

<script>
function generatePrompt(){
const category=document.getElementById('category').value;
const goal=document.getElementById('goal').value.trim();
const style=document.getElementById('style').value;

if(!goal){
alert('Please describe what you want to achieve.');
return;
}

const prompt=`Act as an expert in ${category}.

My goal: ${goal}

Please respond in this style: ${style}.

Give me a clear, useful and well-structured answer. Include examples where helpful and explain difficult concepts in an understandable way.`;

document.getElementById('output').textContent=prompt;
  let history = JSON.parse(localStorage.getItem('promptHistory') || '[]');

history.unshift(prompt);
history = history.slice(0, 5);

localStorage.setItem('promptHistory', JSON.stringify(history));

document.getElementById('history').textContent =
history.map((item, i) => (i + 1) + '. ' + item).join('\n\n');

}

function copyPrompt(){
const output=document.getElementById('output').textContent;
if(output==='Your prompt will appear here...'){
alert('Generate a prompt first!');
return;
}
navigator.clipboard.writeText(output)
.then(()=>alert('Prompt copied!'))
.catch(()=>alert('Please select and copy the prompt manually.'));
}
</script>
</body>
</html>
